# Copy these entries to your ESPHome secrets.yaml and replace the placeholders.
# NEVER commit your real secrets to a public repository.

wifi_ssid: "YOUR_WIFI_SSID"
wifi_password: "YOUR_WIFI_PASSWORD"

# ESPHome native API encryption key.
# Must be a valid Base64-encoded 32-byte key, for example generated with:
#   openssl rand -base64 32
api_encryption_key: "YOUR_BASE64_API_ENCRYPTION_KEY"

# OTA can use a normal strong password.
ota_password: "YOUR_STRONG_OTA_PASSWORD"
