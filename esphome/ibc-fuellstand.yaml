substitutions:
  device_name: ibc-fuellstand
  friendly_name: "IBC Füllstand"
  tank_capacity_l: "1000"
  distance_empty_cm: "100"
  distance_full_cm: "10"
  sleep_time: "15min"

  # A02YYUW wiring
  a02_rx_pin: GPIO16
  a02_power_pin: GPIO17

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  comment: "Batteriebetriebener Füllstandssensor für einen 1000-Liter-IBC mit A02YYUW"
  on_boot:
    - priority: 600
      then:
        - binary_sensor.template.publish:
            id: measurement_valid
            state: OFF
        - lambda: |-
            id(a02_samples).clear();
            id(a02_frame).clear();
        - output.turn_on: a02_power
        - delay: 800ms
        - script.execute: awake_failsafe

esp32:
  board: lolin32_lite
  framework:
    type: arduino

logger:
  level: INFO

api:
  id: native_api
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  reboot_timeout: 0s

deep_sleep:
  id: deep_sleep_control
  sleep_duration: ${sleep_time}

# The A02YYUW is powered through a P-channel AO3401A high-side switch.
# GPIO17 LOW = sensor ON, GPIO17 HIGH/high-impedance = sensor OFF.
# 'inverted: true' makes output.turn_on behave intuitively.
output:
  - platform: gpio
    id: a02_power
    pin:
      number: ${a02_power_pin}
      inverted: true

uart:
  id: a02_uart
  rx_pin: ${a02_rx_pin}
  baud_rate: 9600
  rx_buffer_size: 256

binary_sensor:
  - platform: gpio
    name: "IBC Wartungsmodus"
    id: maintenance_mode
    pin:
      number: GPIO13
      mode:
        input: true
        pullup: true
      inverted: true
    entity_category: diagnostic

    on_press:
      - logger.log: "Wartungsmodus EIN - Deep Sleep gesperrt"
      - output.turn_on: a02_power

    on_release:
      - logger.log: "Wartungsmodus AUS - Deep Sleep erlaubt"

  - platform: template
    name: "Letzte Entfernungsmessung gültig"
    id: measurement_valid
    entity_category: diagnostic
    lambda: return {};

globals:
  - id: a02_frame
    type: std::vector<uint8_t>
    restore_value: no
  - id: a02_samples
    type: std::vector<int>
    restore_value: no

sensor:
  - platform: template
    name: "IBC Abstand"
    id: ibc_distance
    unit_of_measurement: cm
    accuracy_decimals: 1
    device_class: distance
    state_class: measurement
    update_interval: never

  - platform: template
    name: "IBC Füllstand"
    id: ibc_fill_percent
    unit_of_measurement: "%"
    accuracy_decimals: 1
    icon: mdi:water-percent
    state_class: measurement
    update_interval: never

  - platform: template
    name: "IBC Wassermenge"
    id: ibc_water_liters
    unit_of_measurement: L
    accuracy_decimals: 0
    device_class: volume_storage
    state_class: measurement
    update_interval: never

  - platform: wifi_signal
    name: "IBC WLAN-Signal"
    id: ibc_wifi_signal
    update_interval: 2s
    entity_category: diagnostic

  - platform: template
    name: "IBC Uptime aktiv"
    id: ibc_active_uptime
    unit_of_measurement: s
    accuracy_decimals: 1
    device_class: duration
    state_class: measurement
    entity_category: diagnostic
    update_interval: never

text_sensor:
  - platform: version
    name: "ESPHome-Version"
    entity_category: diagnostic

button:
  - platform: restart
    name: "IBC Neustart"
    entity_category: diagnostic

  - platform: template
    name: "IBC Jetzt messen"
    on_press:
      - output.turn_on: a02_power
      - delay: 800ms
      - lambda: |-
          id(a02_samples).clear();
          id(a02_frame).clear();

script:
  - id: publish_measurement
    mode: restart
    then:
      - lambda: |-
          if (id(a02_samples).size() < 5) {
            ESP_LOGW("ibclevel", "Nicht genug gültige A02YYUW-Messwerte: %d", (int) id(a02_samples).size());
            id(measurement_valid).publish_state(false);
            return;
          }

          std::vector<int> sorted = id(a02_samples);
          std::sort(sorted.begin(), sorted.end());
          const int median_mm = sorted[sorted.size() / 2];
          const float distance_cm = median_mm / 10.0f;
          const float empty_cm = ${distance_empty_cm};
          const float full_cm = ${distance_full_cm};

          if (empty_cm <= full_cm) {
            ESP_LOGE("ibclevel", "Kalibrierung ungültig: empty_cm muss größer als full_cm sein");
            id(measurement_valid).publish_state(false);
            return;
          }

          float percent = 100.0f * (empty_cm - distance_cm) / (empty_cm - full_cm);
          percent = std::max(0.0f, std::min(100.0f, percent));

          id(ibc_distance).publish_state(distance_cm);
          id(ibc_fill_percent).publish_state(percent);
          id(ibc_water_liters).publish_state(percent * ${tank_capacity_l} / 100.0f);
          id(measurement_valid).publish_state(true);

          ESP_LOGI("ibclevel", "A02YYUW: samples=%d median=%.1f cm level=%.1f%%",
                   (int) sorted.size(), distance_cm, percent);

          id(a02_samples).clear();

      - sensor.template.publish:
          id: ibc_active_uptime
          state: !lambda return millis() / 1000.0f;

      - if:
          condition:
            binary_sensor.is_off: maintenance_mode
          then:
            - wait_until:
                condition:
                  api.connected:
                    state_subscription_only: true
                timeout: 20s
            - delay: 1200ms
            - output.turn_off: a02_power
            - logger.log: "Messung abgeschlossen - A02YYUW AUS, gehe schlafen"
            - deep_sleep.enter: deep_sleep_control
          else:
            - logger.log: "Wartungsmodus EIN - A02YYUW bleibt für Folgemessungen aktiv"

  - id: awake_failsafe
    mode: single
    then:
      - delay: 45s
      - if:
          condition:
            binary_sensor.is_off: maintenance_mode
          then:
            - output.turn_off: a02_power
            - logger.log: "45-s-Failsafe: A02YYUW AUS, gehe schlafen"
            - deep_sleep.enter: deep_sleep_control
          else:
            - logger.log: "45-s-Failsafe: Wartungsmodus EIN, bleibe wach"

interval:
  # Parse the A02YYUW four-byte UART frame:
  # 0xFF, distance high byte, distance low byte, checksum.
  - interval: 20ms
    then:
      - lambda: |-
          while (id(a02_uart).available()) {
            uint8_t byte;
            if (!id(a02_uart).read_byte(&byte)) break;

            auto &frame = id(a02_frame);
            if (frame.empty()) {
              if (byte == 0xFF) frame.push_back(byte);
              continue;
            }

            frame.push_back(byte);
            if (frame.size() < 4) continue;

            const uint8_t checksum = (frame[0] + frame[1] + frame[2]) & 0xFF;
            if (checksum == frame[3]) {
              const int distance_mm = (frame[1] << 8) | frame[2];
              if (distance_mm >= 30 && distance_mm <= 4500) {
                auto &samples = id(a02_samples);
                if (samples.size() < 31) samples.push_back(distance_mm);
              }
            }
            frame.clear();
          }

  # In normal mode this publishes the first measurement and then sleeps.
  # In maintenance mode it produces a fresh median roughly every 5 seconds.
  - interval: 5s
    then:
      - if:
          condition:
            lambda: return id(a02_samples).size() >= 5;
          then:
            - script.execute: publish_measurement

# A02YYUW RX is intentionally left unconnected. According to the DFRobot
# documentation, floating/high selects the processed/stable output mode.
